services:
  - type: web
    name: tribulation-radio-status
    runtime: node
    plan: free
    region: ohio
    rootDir: render-dashboard
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: RADIO_STATUS_URL
        value: https://tribulationradio.freesrv.com/?health=1
